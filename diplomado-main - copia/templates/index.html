{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Pagos - Diplomado IA Generativa</title>
    <link rel="stylesheet" href="{% static 'css/styles1.css' %}">
    
</head>
<body class="bg-tech">
    <div class="welcome-overlay">
        <div class="welcome-card">
            <div class="logos-welcome">
                <img src="{% static 'img/universidad-de-carabobo-logo-png_seeklogo-535325.png' %}" alt="UC Logo">
                <img src="{% static 'img/Zynaoxe.png' %}" alt="Zynapxe Logo">
                <img src="{% static 'img/cenforpro.png' %}" alt="Cenforpro Logo">
            </div>
            <h1>Portal de Mensualidades</h1>
            <h2>Diplomado en IA Generativa</h2>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert-error">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form action="{% url 'login_pagos' %}" method="POST" class="login-form">
                {% csrf_token %}
                
                <input type="text" name="cedula" class="login-input" placeholder="Cédula de Identidad" required autocomplete="off">
                
                <div class="password-container">
                    <input type="password" name="contrasena" id="contrasena" class="login-input" placeholder="Contraseña" required>
                    <button type="button" id="togglePassword" class="toggle-password-btn" aria-label="Mostrar contraseña">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                
                <button type="submit" class="btn-enter" style="width: 85%; border: none; cursor: pointer; margin-top: 10px;">
                    Ingresar
                </button>
            </form>
            
        </div>
    </div>
    
    <script>
        // Funcionalidad del ojito de la contraseña
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('contrasena');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePasswordBtn.addEventListener('click', function () {
            // Verifica el tipo actual y lo alterna
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Alterna el ícono SVG (Ojo tachado vs Ojo abierto)
            if (type === 'text') {
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        });

        // Script para precargar la imagen de fondo
        window.addEventListener('load', function() {
            const bgImageUrl = '{% static "img/fondo_ia.jpeg" %}'; 
            const img = new Image();
            img.src = bgImageUrl;
            
            img.onload = function() {
                document.body.classList.add('loaded');
            };

            img.onerror = function() {
                console.warn("La imagen de fondo falló, pero cargando el sistema...");
                document.body.classList.add('loaded');
            };
        });
    </script>
</body>
</html>
